<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TITAN MOTORS — Exceptional Vehicles</title>
    <meta name="description" content="Discover exceptional vehicles at TITAN MOTORS. Explore our curated collection and contact our team directly by WhatsApp, telephone or email." />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      (function () {
        var theme;
        try { theme = localStorage.getItem('titan-theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TITAN MOTORS" />
    <meta property="og:title" content="TITAN MOTORS — Exceptional Vehicles" />
    <meta property="og:description" content="Discover exceptional vehicles. Experience excellence. Find your next drive." />
    <meta property="og:image" content="/images/hero-car.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" href="/images/hero-car.webp" imagesrcset="/images/hero-car-860.webp 860w, /images/hero-car.webp 1600w" imagesizes="(max-width: 900px) 100vw, 62vw" fetchpriority="high" />
    <link rel="preconnect" href="https://images.unsplash.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
